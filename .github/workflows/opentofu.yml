name: OpenTofu

on:
  push:
    branches: [main]
    paths:
      - '*.tf'
      - '.terraform.lock.hcl'
      - '.params2env.yaml'
      - '.github/workflows/opentofu.yml'
      - 'modules/**/*.tf'
      - 'modules/**/.terraform.lock.hcl'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TOFU_VERSION: '1.11.2'

jobs:
  iac:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load secrets from SSM
        uses: wombelix/build-helper-scripts/.github/actions/load-ssm-secrets@main

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: OpenTofu Init
        run: tofu init -input=false

      - name: OpenTofu Plan
        run: tofu plan -input=false -compact-warnings -out=plan.file

      - name: OpenTofu Apply
        run: tofu apply -input=false -compact-warnings plan.file
